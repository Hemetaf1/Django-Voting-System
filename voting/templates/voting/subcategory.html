{# voting/templates/voting/subcategory.html #}
{% extends "base.html" %}
{% block content %}
  <div class="container mx-auto px-4 py-6 text-center">
    <h2 class="text-3xl font-bold mb-6">{{ section.name }}</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 justify-items-center">
      {% for project in projects %}
        <div class="bg-white rounded-xl shadow-lg p-4 flex flex-col items-center w-full max-w-xs">
          <!-- تصویر: h-56 به جای h-48 تا کمی بزرگ‌تر باشد -->
          <img
            src="{{ project.image.url }}"
            alt="{{ project.title }}"
            class="w-full h-56 object-cover rounded-lg mb-4"
          />

          <h3 class="text-lg font-semibold mb-2">{{ project.title }}</h3>

          <button
            id="vote-btn-{{ project.id }}"
            hx-post="{% url 'vote' project.id %}"
            hx-swap="outerHTML"
            class="mt-auto px-5 py-2 bg-gradient-to-br from-blue-600 to-blue-800
                   text-white rounded-full hover:scale-105 transition-transform"
          >
            رأی دهید
          </button>
        </div>
      {% empty %}
        <p class="col-span-full text-gray-500">هنوز پروژه‌ای ثبت نشده.</p>
      {% endfor %}
    </div>

    <a href="{% url 'index' %}" class="mt-8 inline-block text-blue-700 hover:underline">
      ← بازگشت به صفحهٔ اصلی
    </a>
  </div>
{% endblock %}
